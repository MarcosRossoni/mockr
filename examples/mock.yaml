auth:
  url: http://localhost:9999/auth
  method: POST
  users: ./examples/auth_users.json
  extract: "data.token"
  header: "Authorization"
  prefix: "Bearer "

routes:
  - method: POST
    path: /auth
    response: ./examples/auth_response.json
    status: 200

  - method: GET
    path: /users
    response: ./examples/users.json
    status: 200
    delay: 50ms

  - method: GET
    path: /users/:id
    response: ./examples/user.json
    status: 200

  - method: POST
    path: /users
    response: ./examples/user_created.json
    body: ./examples/user.json
    status: 201
    delay: 100ms
    auth: true
    headers:
      X-Request-ID: "{{uuid}}"
      X-Timestamp: "{{now.unix}}"
