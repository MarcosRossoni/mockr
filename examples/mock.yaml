routes:
  - method: GET
    path: /users
    response: ./examples/users.json
    status: 200
    delay: 50ms

  - method: GET
    path: /users/:id
    response: ./examples/user.json
    status: 200

  - method: POST
    path: /users
    response: ./examples/user_created.json
    status: 201
    delay: 100ms
